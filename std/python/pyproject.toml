[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benc-runtime"
version = "2.0.0"
description = "Benc wire v1 runtime for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Benc contributors"}]

[project.urls]
Repository = "https://github.com/banditmoscow1337/benc"

[tool.setuptools]
py-modules = ["bstd"]
